name: iron_denim
description: IRON DENIM - aplikasi toko jeans & jaket denim.
publish_to: 'none'
version: 1.2.1+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Playfair
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
  assets:
    - assets/images/logo.png
    - assets/images/products/
